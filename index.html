<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه پایش حریق استان فارس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        سامانه پایش حریق استان فارس
    </header>

    <div class="filters">
        <button class="filter-btn" data-filter="today">
            امروز
        </button>

        <button class="filter-btn" data-filter="24h">
            ۲۴ ساعت گذشته
        </button>

        <button class="filter-btn active" data-filter="5days">
            ۵ روز گذشته
        </button>
    </div>

    <main id="map"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- تغییر نسخه برای جلوگیری از Cache -->
    <script src="app.js?v=5"></script>

</body>
</html>
